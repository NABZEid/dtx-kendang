name: Build APK
on:
  workflow_dispatch:
  push:
    branches: ['**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate folder android
        run: flutter create --platforms=android --project-name dtx_kendang --org com.dtx .
      - name: Set minSdk 24 dan nama aplikasi
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then sed -i -E 's/minSdk(Version)?( *=)? *flutter\.minSdkVersion/minSdk = 24/' "$f"; fi
          done
          sed -i 's/android:label="dtx_kendang"/android:label="DTX Kendang"/' android/app/src/main/AndroidManifest.xml || true
      - name: Paksa compileSdk 36 untuk semua plugin
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-sdk.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android')) {
                p.android.compileSdkVersion 36
              }
            }
          }
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: dtx-kendang-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DTX Kendang build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
